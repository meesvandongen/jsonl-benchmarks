version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jsonl_bench_pg
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tuned for benchmark workloads
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=512MB
        -c wal_level=minimal
        -c max_wal_senders=0
        -c fsync=off
        -c synchronous_commit=off
        -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
